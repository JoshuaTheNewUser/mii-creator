<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mii Creator</title>
  <meta name="description" content="Create and customize your own Mii.">

  <link rel="stylesheet" href="dist/main.css">
</head>

<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <strong>Mii Creator</strong>
      <span>Create your own Mii</span>
    </div>

    <div class="toolbar">
      <button id="undo" title="Undo">↶</button>
      <button id="redo" title="Redo">↷</button>
      <button id="randomize">🎲 Random</button>
      <button id="save">💾 Save</button>
    </div>
  </header>

  <!-- Main editor -->
  <main class="creator">

    <!-- Original-style category bar -->
    <nav class="categories" aria-label="Mii categories">
      <button class="category active" data-section="face">Face</button>
      <button class="category" data-section="hair">Hair</button>
      <button class="category" data-section="eyes">Eyes</button>
      <button class="category" data-section="eyebrows">Eyebrows</button>
      <button class="category" data-section="nose">Nose</button>
      <button class="category" data-section="mouth">Mouth</button>
      <button class="category" data-section="facial-hair">Facial Hair</button>
      <button class="category" data-section="body">Body</button>
      <button class="category" data-section="clothing">Clothing</button>
      <button class="category" data-section="accessories">Accessories</button>
    </nav>

    <section class="editor">

      <!-- Left: part selector -->
      <aside class="parts-panel">

        <div class="panel-header">
          <h2 id="category-title">Face</h2>

          <input
            id="part-search"
            type="search"
            placeholder="Search parts..."
            aria-label="Search Mii parts"
          >
        </div>

        <div id="parts-list">
          <!-- Existing generated Mii controls go here -->
        </div>

        <div class="panel-actions">
          <button id="favorite">☆ Favorite</button>
          <button id="random-part">🎲 Random</button>
        </div>

      </aside>

      <!-- Center: Mii preview -->
      <section class="preview">

        <div class="preview-toolbar">
          <button id="camera-front">Front</button>
          <button id="camera-3d">3D</button>
          <button id="camera-reset">Reset</button>
          <button id="fullscreen">⛶</button>
        </div>

        <div id="mii-preview">
          <!-- Mii Creator 3D renderer -->
        </div>

        <div class="preview-controls">
          <button id="rotate-left">↺</button>
          <button id="rotate-right">↻</button>
          <button id="zoom-out">−</button>
          <button id="zoom-in">＋</button>
        </div>

        <div class="animation-controls">
          <select id="animation-select">
            <option value="Wait">Idle</option>
            <option value="Greeting">Greeting</option>
            <option value="Happy">Happy</option>
            <option value="Surprised">Surprised</option>
          </select>

          <button id="play-animation">▶</button>
        </div>

      </section>

      <!-- Right: options -->
      <aside class="options-panel">

        <div class="panel-header">
          <h2>Options</h2>
        </div>

        <section class="option-group">
          <h3>Colors</h3>

          <button id="skin-color">Skin Color</button>
          <button id="hair-color">Hair Color</button>
          <button id="eye-color">Eye Color</button>
          <button id="clothing-color">Clothing Color</button>
        </section>

        <section class="option-group">
          <h3>Body</h3>

          <label for="body-model">Body Model</label>

          <select id="body-model">
            <option value="wiiu">Wii U</option>
            <option value="switch">Switch</option>
            <option value="miitomo">Miitomo</option>
            <option value="baby">Baby 👶</option>
          </select>

          <label for="height">Height</label>
          <input id="height" type="range" min="0" max="100">

          <label for="build">Build</label>
          <input id="build" type="range" min="0" max="100">
        </section>

        <section class="option-group">
          <h3>Background</h3>

          <button id="background-default">Default</button>
          <button id="background-transparent">Transparent</button>
          <button id="background-custom">Custom</button>
        </section>

      </aside>

    </section>

  </main>

  <!-- Bottom actions -->
  <footer class="bottom-bar">

    <div class="quick-actions">
      <button id="import">📥 Import</button>
      <button id="presets">⭐ Presets</button>
      <button id="share">🔗 Share</button>
    </div>

    <div class="export-actions">
      <button id="export-image">🖼️ Export Image</button>
      <button id="export-glb">📦 Export GLB</button>
    </div>

  </footer>

  <!-- Modals -->
  <dialog id="preset-dialog">
    <h2>Mii Presets</h2>

    <div id="preset-list"></div>

    <button id="close-presets">Close</button>
  </dialog>

  <dialog id="settings-dialog">
    <h2>Settings</h2>

    <label>
      Theme
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>

    <label>
      <input id="reduced-motion" type="checkbox">
      Reduce animations
    </label>

    <button id="close-settings">Close</button>
  </dialog>

  <!-- Notifications -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <span>Loading Mii Creator...</span>
  </div>

  <script>
    const global = {};
    const process = { env: { NODE_DEBUG: false } };
  </script>

  <script type="module" src="dist/main.js"></script>

</body>
</html>
